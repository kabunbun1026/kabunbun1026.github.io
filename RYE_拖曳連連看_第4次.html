<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>第4次注音練習 拖曳連連看</title>
  <style>
    body {
      font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      color: #2c3e50;
      text-align: center;
      margin-bottom: 5px;
      font-size: 24px;
    }
    
    .reference-banner {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 10px 0 15px 0;
      background-color: #e8f4f8;
      padding: 10px 20px;
      border-radius: 10px;
      border: 2px solid #3498db;
    }
    .ref-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 20px;
      font-weight: bold;
      color: #2c3e50;
    }
    .ref-item span:first-child {
      color: #e74c3c;
      font-family: Arial, sans-serif;
      margin-bottom: 3px;
    }
    .ref-item span:last-child {
      font-family: 'Bopomofo', 'Microsoft JhengHei', sans-serif;
    }

    .instruction {
      color: #7f8c8d; 
      margin-bottom: 15px; 
      text-align: center;
      font-size: 14px;
    }
    
    .game-section {
      display: none;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 600px;
    }
    .game-section.active {
      display: flex;
    }

    .flex-3-2 {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }

    .pinyin-slot-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      background: #fff;
      padding: 10px;
      border-radius: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      width: calc(33% - 15px);
      min-width: 90px;
      box-sizing: border-box;
    }
    .pinyin-label {
      font-size: 15px;
      font-weight: bold;
      color: #3498db;
      text-align: center;
    }
    .drop-slot {
      width: 60px;
      height: 80px;
      border: 2px dashed #bdc3c7;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
    }
    .drop-slot.hovered {
      background: #e8f4f8;
      border-color: #3498db;
    }

    .zhuyin-tile {
      background: #fff;
      border: 2px solid #e67e22;
      border-radius: 8px;
      width: 60px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      user-select: none;
    }
    .zhuyin-tile:active {
      cursor: grabbing;
      opacity: 0.8;
    }

    .zhuyin-col {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      font-size: 20px;
      line-height: 1.1;
      font-family: 'Bopomofo', 'Microsoft JhengHei', sans-serif;
      font-weight: bold;
      color: #2c3e50;
      pointer-events: none;
    }
    .z-tone {
      position: absolute;
      right: -0.6em;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
    }
    .z-tone-0 {
      right: auto;
      top: -0.8em;
      left: 50%;
      transform: translateX(-50%);
    }

    .dragging { opacity: 0.5; }
    .correct {
      border-color: #2ecc71 !important;
      background-color: #eafaf1 !important;
    }
    
    .controls {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #2ecc71;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    button:active { background-color: #27ae60; }
    button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    
    .area-title {
      text-align: center;
      font-weight: bold;
      color: #7f8c8d;
      margin-top: 10px;
      margin-bottom: 5px;
    }
    .drop-area { margin-bottom: 20px; }
  </style>
</head>
<body>

  <h1>第4次注音練習 拖曳連連看</h1>
  
  <div class="reference-banner">
    <div class="ref-item"><span>q</span><span>ㄑ</span></div>
    <div class="ref-item"><span>x</span><span>ㄒ</span></div>
    <div class="ref-item"><span>zh</span><span>ㄓ</span></div>
    <div class="ref-item"><span>ch</span><span>ㄔ</span></div>
  </div>

  <p class="instruction">請將下方的注音拖曳到對應的拼音框框中。<br><span id="group-indicator"></span></p>
  
  <div class="game-section active" id="game-container">
    <div class="area-title">拼音區 (放注音進來)</div>
    <div class="flex-3-2 drop-area" id="pinyin-area"></div>
    
    <div class="area-title">注音區 (請拖曳)</div>
    <div class="flex-3-2" id="zhuyin-area"></div>
  </div>
  
  <div class="controls">
    <button id="btn-restart" onclick="restartGame()">重新開始</button>
    <button id="btn-next" style="display:none;" onclick="nextGroup()">下一組</button>
  </div>

  <script>
    const pairs = [
      { id: 1, pinyin: "去(去學校 qù)", zhuyin: ["ㄑ", "ㄩ"], tone: "ˋ" },
      { id: 2, pinyin: "請(請問 qǐng)", zhuyin: ["ㄑ", "ㄧ", "ㄥ"], tone: "ˇ" },
      { id: 3, pinyin: "新(新同學 xīn)", zhuyin: ["ㄒ", "ㄧ", "ㄣ"], tone: " " },
      { id: 4, pinyin: "姓(姓名 xìng)", zhuyin: ["ㄒ", "ㄧ", "ㄥ"], tone: "ˋ" },
      { id: 5, pinyin: "喜(喜歡 xǐ)", zhuyin: ["ㄒ", "ㄧ"], tone: "ˇ" },
      { id: 6, pinyin: "謝(謝謝 xiè)", zhuyin: ["ㄒ", "ㄧ", "ㄝ"], tone: "ˋ" },
      { id: 7, pinyin: "知(知道 zhī)", zhuyin: ["ㄓ"], tone: " " },
      { id: 8, pinyin: "中(中國 zhōng)", zhuyin: ["ㄓ", "ㄨ", "ㄥ"], tone: " " },
      { id: 9, pinyin: "吃(吃飯 chī)", zhuyin: ["ㄔ"], tone: " " },
      { id: 10, pinyin: "茶(喝茶 chá)", zhuyin: ["ㄔ", "ㄚ"], tone: "ˊ" }
    ];

    let currentGroupIndex = 0;
    let groups = [];
    let correctCount = 0;

    function createZhuyinHTML(zhuyinArr, tone) {
      let charsHTML = zhuyinArr.map(c => `<div class="z-char">${c}</div>`).join('');
      let toneClass = tone === '˙' ? 'z-tone z-tone-0' : 'z-tone';
      let toneHTML = tone && tone !== ' ' ? `<div class="${toneClass}">${tone}</div>` : '';
      return `<div class="zhuyin-col">${charsHTML}${toneHTML}</div>`;
    }

    function initGame() {
      groups = [];
      for(let i=0; i<pairs.length; i+=5) {
        groups.push(pairs.slice(i, i+5));
      }
      
      currentGroupIndex = 0;
      loadGroup(currentGroupIndex);
    }
    
    function restartGame() {
      currentGroupIndex = 0;
      loadGroup(currentGroupIndex);
    }
    
    function nextGroup() {
      currentGroupIndex++;
      if (currentGroupIndex < groups.length) {
        loadGroup(currentGroupIndex);
      }
    }

    function loadGroup(index) {
      const pinyinArea = document.getElementById('pinyin-area');
      const zhuyinArea = document.getElementById('zhuyin-area');
      const groupData = groups[index];
      
      document.getElementById('group-indicator').innerText = `目前進度：第 ${index + 1} 組 / 共 ${groups.length} 組`;
      document.getElementById('btn-next').style.display = 'none';
      
      pinyinArea.innerHTML = '';
      zhuyinArea.innerHTML = '';
      correctCount = 0;

      groupData.forEach(p => {
        const row = document.createElement('div');
        row.className = 'pinyin-slot-container';
        row.innerHTML = `
          <div class="pinyin-label">${p.pinyin.split(' ').join('<br>')}</div>
          <div class="drop-slot" data-id="${p.id}"></div>
        `;
        pinyinArea.appendChild(row);
      });

      let shuffled = [...groupData].sort(() => Math.random() - 0.5);
      shuffled.forEach(p => {
        const tile = document.createElement('div');
        tile.className = 'zhuyin-tile';
        tile.draggable = true;
        tile.dataset.id = p.id;
        tile.innerHTML = createZhuyinHTML(p.zhuyin, p.tone);
        
        tile.addEventListener('dragstart', dragStart);
        tile.addEventListener('dragend', dragEnd);
        
        tile.addEventListener('touchstart', touchStart, {passive: false});
        tile.addEventListener('touchmove', touchMove, {passive: false});
        tile.addEventListener('touchend', touchEnd);

        zhuyinArea.appendChild(tile);
      });

      setupDropSlots();
    }

    let draggedItem = null;
    function dragStart(e) {
      draggedItem = this;
      setTimeout(() => this.classList.add('dragging'), 0);
    }
    function dragEnd() {
      this.classList.remove('dragging');
      draggedItem = null;
    }

    function setupDropSlots() {
      const slots = document.querySelectorAll('.drop-slot');
      slots.forEach(slot => {
        slot.addEventListener('dragover', e => {
          e.preventDefault();
          if (!slot.hasChildNodes()) slot.classList.add('hovered');
        });
        slot.addEventListener('dragleave', () => slot.classList.remove('hovered'));
        slot.addEventListener('drop', function(e) {
          e.preventDefault();
          this.classList.remove('hovered');
          handleDrop(draggedItem, this);
        });
      });
    }

    let touchEl = null;
    let initialX = 0, initialY = 0;
    
    function touchStart(e) {
      if(this.parentElement.classList.contains('drop-slot')) return;
      touchEl = this;
      const touch = e.touches[0];
      const rect = touchEl.getBoundingClientRect();
      initialX = touch.clientX - rect.left;
      initialY = touch.clientY - rect.top;
      
      touchEl.style.position = 'fixed';
      touchEl.style.zIndex = 1000;
      touchEl.classList.add('dragging');
      touchMove(e);
    }
    
    function touchMove(e) {
      if(!touchEl) return;
      e.preventDefault(); 
      const touch = e.touches[0];
      touchEl.style.left = (touch.clientX - initialX) + 'px';
      touchEl.style.top = (touch.clientY - initialY) + 'px';
    }
    
    function touchEnd(e) {
      if(!touchEl) return;
      touchEl.style.position = 'static';
      touchEl.style.zIndex = 'auto';
      touchEl.style.left = 'auto';
      touchEl.style.top = 'auto';
      touchEl.classList.remove('dragging');
      
      const touch = e.changedTouches[0];
      const dropTarget = document.elementFromPoint(touch.clientX, touch.clientY);
      const slot = dropTarget ? dropTarget.closest('.drop-slot') : null;
      
      if (slot && !slot.hasChildNodes()) {
        handleDrop(touchEl, slot);
      }
      touchEl = null;
    }

    function handleDrop(item, slot) {
      if (!item || !slot) return;
      if (item.dataset.id === slot.dataset.id) {
        slot.appendChild(item);
        item.draggable = false;
        item.removeEventListener('touchstart', touchStart);
        slot.classList.add('correct');
        item.classList.add('correct');
        item.style.border = 'none';
        item.style.boxShadow = 'none';
        
        correctCount++;
        const currentGroupData = groups[currentGroupIndex];
        if (correctCount === currentGroupData.length) {
          if (currentGroupIndex < groups.length - 1) {
             document.getElementById('btn-next').style.display = 'inline-block';
             setTimeout(() => alert('太棒了！這組配對成功，請點擊「下一組」繼續。'), 300);
          } else {
             setTimeout(() => alert('恭喜！全部題目配對成功！'), 300);
          }
        }
      } else {
        slot.style.borderColor = '#e74c3c';
        setTimeout(() => slot.style.borderColor = '#bdc3c7', 500);
      }
    }

    window.onload = initGame;
  </script>
</body>
</html>
