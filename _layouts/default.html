<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            color: #333;
        }

        header,
        footer {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 1rem;
        }

        footer {
            border-bottom: none;
            border-top: 1px solid #eee;
            margin-top: 2rem;
            padding-top: 1rem;
            font-size: 0.9em;
            color: #777;
        }

        nav a {
            margin: 0 10px;
            text-decoration: none;
            color: #0056b3;
        }

        nav a:hover {
            text-decoration: underline;
        }

        h1,
        h2,
        h3 {
            color: #111;
        }
    </style>
</head>

<body>
    <header>
        <h1><a href="{{ '/' | relative_url }}" style="text-decoration:none; color:inherit;">{{ site.title }}</a></h1>
        <nav>
            <a href="{{ '/' | relative_url }}">Home</a>
            <a href="{{ '/hanzi-master-vn-privacy-policy.html' | relative_url }}">Privacy Policy</a>
        </nav>
    </header>

    <main>
        {{ content }}
    </main>

    <footer>
        <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}</p>
    </footer>
</body>

</html>
